name: Validate and deploy Pages

on:
  push:
    branches:
      - main
      - release/v2
  pull_request:
    branches:
      - main
      - release/v2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm install
      - run: npm run release:check

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/release/v2'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm install
      - run: npm run docs
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: examples/element-ui
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
